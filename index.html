function bindLogin() {
  const boxes = [...document.querySelectorAll('.code6 input')];
  boxes.forEach((b, i) => {
    b.addEventListener('input', () => {
      const v = b.value.replace(/\D/g, '');

function filtered(f, scope) {
  const now = new Date(), k0 = dayKey(now), k1 = dayKey(addDays(now, 1)), k7 = dayKey(addDays(now, 7));
  let xs = S.tasks.slice();
  if (scope === 'mine') xs = xs.filter(x => x.assigneeId === S.user.id);
  xs = xs.filter(x => {
    const st = status(x), k = x.due ? x.due.slice(0, 10) : k0;
    if (f === 'done') return st === 'done';
    if (st === 'done') return f === 'today' && k === k0;
    if (f === 'today') return k <= k0;
    if (f === 'tomorrow') return k === k1;
    if (f === 'week') return k <= k7;
    return true;
  });
  const rank = { late: 0, prog: 1, new: 2, done: 3 };
  return xs.sort((a, b) => f === 'done' ? (b.doneAt || '').localeCompare(a.doneAt || '') : (rank[status(a)] - rank[status(b)]) || (a.due || '').localeCompare(b.due || ''));
}

  const st = status(x), canEdit = isMgr() || x.createdBy === S.user.id;
  return `<div class="lrow${st === 'done' ? ' done' : ''}"><button class="ck${st === 'done' ? ' on' : ''}" data-done="${x.id}" aria-label="${t('done')}">${st === 'done' ? ic('check', 16, '#FFC800', 2.8) : ''}</button>
  <${canEdit ? `button data-edit="${x.id}"` : 'div'} class="lr-t"><b>${esc(x.title)}</b><small>${ic('clock', 13)}<span>${fmtDue(x.due)}</span>${st === 'late' ? `<span class="chip st-late">${t('st_late')}</span>` : ''}</small></${canEdit ? 'button' : 'div'}></div>`;
}
function vHome() {
  const now = new Date(), h = now.getHours();
  const greet = `${h < 12 ? t('morning') : h < 18 ? t('hello') : t('evening')}، ${esc(S.user.name)}`.replace('،', S.lang === 'ar' ? '،' : ',');
  const date = `${t('days')[now.getDay()]} ${now.getDate()} ${t('months')[now.getMonth()]}`;
  const scope = isMgr() ? S.tasks : S.tasks.filter(x => x.assigneeId === S.user.id);
  const today = scope.filter(x => (x.due || '').slice(0, 10) <= dayKey(now) && (status(x) !== 'done' || (x.doneAt || '').slice(0, 10) === dayKey(now)));
  const mine = filtered('today', 'mine'), mDone = mine.filter(x => status(x) === 'done').length;
  const shownT = mine.filter(x => status(x) !== 'done').concat(mine.filter(x => status(x) === 'done')).slice(0, 6);
  let teamHtml = '';
  if (isMgr()) {
    const people = S.team.filter(u => u.active).map(u => {
      const ts = today.filter(x => x.assigneeId === u.id), d = ts.filter(x => status(x) === 'done').length, l = ts.filter(x => status(x) === 'late').length;
      return ts.length ? `<a class="lrow" href="#person/${u.id}" style="text-decoration:none"><span class="av">${initial(u.name)}</span><div class="lr-t"><b>${esc(u.name)}${l ? ` <span class="chip st-late">${l} ${t('late')}</span>` : ''}</b><span class="bar8" style="margin-top:6px"><i style="width:${Math.round(d / ts.length * 100)}%"></i></span></div><span class="d lr-n">${d}/${ts.length}</span></a>` : '';
    }).join('');
    teamHtml = people ? `<div class="h2 row between"><span>${t('team_today')}</span><a href="#team" class="xhl">${t('f_all')} ${ic('chev', 16, 'currentColor', 2, 'go')}</a></div><div class="card list">${people}</div>` : '';
  }
  return hdr(greet, date, `<button class="ib me" data-settings aria-label="${t('settings')}">${initial(S.user.name)}</button>`) +
  `<main class="main">
  ${window.prepHome ? `<div id="x-home" class="stack">${window.prepHome()}</div>` : ''}
  <div class="h2 row between"><span>${t('my_today')} <span class="d" style="color:var(--gold)">${mDone}/${mine.length}</span></span><a href="#tasks" class="xhl">${t('f_all')} ${ic('chev', 16, 'currentColor', 2, 'go')}</a></div>
  <div class="card list">${shownT.length ? shownT.map(taskRow).join('') : `<div class="empty">${t('all_done')}</div>`}</div>
  ${teamHtml}
  </main>`;
}

/* ---------- tasks ---------- */
function taskCard(x) {
  const st = status(x), u = userById(x.assigneeId), canEdit = isMgr() || x.createdBy === S.user.id;
  const rep = x.repeat === 'daily' ? ' · ' + t('daily_r') : x.repeat === 'weekly' ? ' · ' + t('weekly_r') : '';
  return `<div class="card task ts-${st} ${st === 'done' ? 'done' : ''}" data-task="${x.id}">
  <div class="row" style="align-items:flex-start">
   <button class="check ${st === 'done' ? 'on' : ''}" data-done="${x.id}" aria-label="${t('done')}">${ic('check', 22, st === 'done' ? '#fff' : '#C9BEA9', 2.4)}</button>
   <div class="grow" ${canEdit ? `data-edit="${x.id}" style="cursor:pointer"` : ''}><div class="t">${esc(x.title)}</div>
   <div class="meta">${u ? `<span class="av" style="width:24px;height:24px;font-size:11px">${initial(u.name)}</span>${esc(u.name)} ·` : ''}${ic('clock', 15)}<span>${fmtDue(x.due)}${rep}</span></div></div>
   <span class="chip st-${st}">${t('st_' + st)}</span></div>
  ${st !== 'done' && u && u.id !== S.user.id ? `<div class="row"><button class="btn c sm grow" data-remind="${x.id}">${ic('bell', 18)}${t('remind')}</button></div>` : ''}
  </div>`;
}
function vTasks() {
  const fs = ['today', 'tomorrow', 'week', 'done'];
  const list = filtered(S.f, isMgr() ? S.scope : 'mine');
  const count = f => filtered(f, isMgr() ? S.scope : 'mine').filter(x => f === 'done' || status(x) !== 'done').length;
  return hdr(t('tasks'), '') + `<main class="main">
  <div class="pills" role="tablist">${fs.map(f => `<button class="pill ${S.f === f ? 'on' : ''}" data-f="${f}" role="tab" aria-selected="${S.f === f}">${t('f_' + f)}<span class="n">${count(f)}</span></button>`).join('')}</div>
  ${isMgr() ? `<div class="seg">${['all', 'mine'].map(s => `<button class="${S.scope === s ? 'on' : ''}" data-scope="${s}">${t('f_' + s)}</button>`).join('')}</div>` : ''}
  ${list.length ? list.map(taskCard).join('') : `<div class="empty">${t('none')}</div>`}
  </main>`;
}
function vTaskForm(id) {
  const x = id ? S.tasks.find(y => y.id === id) : null;
  const now = new Date();
  if (S.draft && (S.draft.id || null) !== (x ? x.id : null)) S.draft = null;
  const d = S.draft || (x ? { ...x } :{ title: '', assigneeId: S.user.id, due: dayKey(now) + 'T18:00', repeat: 'once', wa: true });
  S.draft = d;
  const day = d.due.slice(0, 10), tm = d.due.slice(11, 16) || '18:00';
  const dayChoice = day === dayKey(now) ? 'today' : day === dayKey(addDays(now, 1)) ? 'tomorrow' : 'pick';
  const people = (isMgr() ? S.team.filter(u => u.active) : [S.user]);
  return hdr(x ? t('edit_task') : t('new_task'), '', '', 'tasks') + `<form class="main" id="tf" style="gap:14px">
  <label class="f">${t('task')}<input class="inp" name="title" value="${esc(d.title)}" placeholder="${t('task_ph')}" maxlength="140" required></label>
  ${people.length > 1 ? `<div class="f" style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600">${t('who')}<div class="people">${people.map(u => `<button type="button" class="${d.assigneeId === u.id ? 'on' : ''}" data-who="${u.id}" aria-pressed="${d.assigneeId === u.id}"><span class="av">${initial(u.name)}</span>${esc(u.name)}</button>`).join('')}</div></div>` : ''}
  <div style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600">${t('when')}
   <div class="pills">${['today', 'tomorrow'].map(k => `<button type="button" class="pill ${dayChoice === k ? 'on' : ''}" data-day="${k}">${t('f_' + k)}</button>`).join('')}
   <input type="date" class="pill ${dayChoice === 'pick' ? 'on' : ''}" data-dayp value="${day}" aria-label="${t('pick')}" style="font-weight:500"></div>
   <label class="row" style="font-weight:500">${ic('clock', 20)}${t('time')}<input type="time" class="inp" name="time" value="${tm}" style="width:130px;height:44px" dir="ltr"></label></div>
  <div style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600">${t('rep')}<div class="seg">${['once', 'daily', 'weekly'].map(r => `<button type="button" class="${d.repeat === r ? 'on' : ''}" data-rep="${r}">${t(r)}</button>`).join('')}</div></div>
  ${!x ? `<div class="card row"><span style="color:#166534">${ic('msg', 22)}</span><div class="grow"><div style="font-weight:600;font-size:15px">${t('wa_send')}</div><div class="muted">${t('wa_send_s')}</div></div><button type="button" class="switch ${d.wa ? 'on' : ''}" data-wa role="switch" aria-checked="${!!d.wa}" aria-label="${t('wa_send')}"></button></div>` : ''}
  <div class="err" id="te"></div>
  <button class="btn y big" type="submit">${ic('check', 20)}${t('save')}</button>
  ${x ? `<button type="button" class="btn red big" data-del="${x.id}">${ic('trash', 20)}${t('del')}</button>` : ''}
  </form>`;
}

/* ---------- team ---------- */
function vTeam() {
  const list = S.team.slice().sort((a, b) => (b.active - a.active) || (a.role === 'manager' ? -1 : 1));
  return hdr(t('team'), t('managers_only'), `<a class="btn y sm" href="#person">${ic('plus', 18)}${t('add')}</a>`) + `<main class="main">
  ${list.map(u => `<div class="card" style="display:flex;flex-direction:column;gap:10px;${u.active ? '' : 'opacity:.75'}">
   <div class="row"><span class="av" style="width:44px;height:44px;font-size:17px">${initial(u.name)}</span><div class="grow"><div style="font-weight:600;font-size:16px">${esc(u.name)}</div><div class="muted"><bdi dir="ltr">${esc(u.username)}</bdi> · ${u.lastLogin ? t('last') + ' ' + fmtDue(u.lastLogin.slice(0, 16)) : t('never')}</div></div>
   ${!u.active ? `<span class="chip st-late">${t('disabled')}</span>` : u.role === 'manager' ? `<span class="chip" style="background:#1F2937;color:#FFC800">${t('manager')}</span>` : `<span class="chip st-new">${t('employee')}</span>`}</div>
   ${u.id !== S.user.id ? `<div class="row" style="flex-wrap:wrap;gap:8px">${u.active ? `<button class="btn c sm grow" data-reset="${u.id}">${ic('key', 18)}${t('reset')}</button><button class="btn o sm grow" data-role="${u.id}">${ic('shield', 18)}${u.role === 'manager' ? t('make_emp') : t('make_mgr')}</button>` : ''}<button class="btn ${u.active ? 'red' : 'o'} sm grow" data-active="${u.id}">${ic('off', 18)}${u.active ? t('disable') : t('enable')}</button></div>` : ''}
  </div>`).join('')}</main>`;
}
function vPerson() {
  return hdr(t('add_person'), t('managers_only'), '', 'team') + `<form class="main" id="pf" style="gap:14px">
  <div class="card row" style="background:#ECFDF3;border-color:#ECFDF3;box-shadow:none;align-items:flex-start"><span style="color:#166534">${ic('msg', 22)}</span><div style="font-size:13px;line-height:1.7">${t('add_info')}</div></div>
  <label class="f">${t('name')}<input class="inp" name="name" required maxlength="40"></label>
  <label class="f">${t('username')}<input class="inp" name="username" dir="ltr" autocapitalize="none" required maxlength="30" pattern="[a-zA-Z0-9._@\\-]+"></label>
  <label class="f">${t('phone')}<input class="inp" name="phone" dir="ltr" inputmode="tel" required placeholder="36 00 00 00"></label>
  <div style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600">${t('role')}<div class="seg"><button type="button" class="on" data-prole="employee">${t('employee')}</button><button type="button" data-prole="manager">${t('manager')}</button></div></div>
  <div class="err" id="pe"></div>
  <button class="btn y big" type="submit">${ic('msg', 20)}${t('add')} · ${t('send_wa')}</button></form>`;
}
function codeSheet(u, code) {
  const link = CFG.APP_URL || location.href.split('#')[0];
  const msg = fill(t('wa_acc'), { n: u.name, u: u.username, c: code, l: link });
  const bg = sheet(`<div class="muted">${t('code_for')} ${esc(u.name)}</div><div class="d" dir="ltr" style="font-size:40px;letter-spacing:.2em;text-align:center">${code}</div>
   <button class="btn y big" data-sendacc>${ic('msg', 20)}${t('send_wa')}</button><button class="btn c big" data-copy>${t('copy')}</button><button class="btn o big" data-close>${t('ok')}</button>`);
  bg.querySelector('[data-sendacc]').onclick = () => wa(u.phone, msg);
  bg.querySelector('[data-copy]').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(msg).then(() => toast(t('copied'))); };
}
function settingsSheet() {
  const bg = sheet(`<div class="row">${LOGO(44)}<div class="grow"><div class="d" style="font-size:18px">${esc(S.user.name)}</div><div class="muted"><bdi dir="ltr">${esc(S.user.username)}</bdi> · ${t(S.user.role)}</div></div></div>
   <div style="font-weight:600;font-size:14px">${ic('globe', 18)} ${t('lang')}</div><div class="seg"><button class="${S.lang === 'ar' ? 'on' : ''}" data-setlang="ar">العربية</button><button class="${S.lang === 'fr' ? 'on' : ''}" data-setlang="fr">Français</button></div>
   <div class="muted">${t('install')}</div>
   <button class="btn red big" data-logout>${ic('out', 20, 'currentColor', 1.8, 'flip')}${t('logout')}</button><div class="muted" style="text-align:center">samarHive · v1.1</div>`);
  bg.addEventListener('click', e => {
    const l = e.target.closest('[data-setlang]'); if (l) { setLang(l.dataset.setlang); bg.remove(); }
    if (e.target.closest('[data-logout]')) { bg.remove(); logout(); }
  });
}
function setLang(l) { S.lang = l; store.set('lang', l); render(); }
function logout(silent) {
  if (!DEMO && !silent && S.token) fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify({ action: 'logout', token: S.token }) }).catch(() => {});
  S.token = null; S.user = null; S.tasks = []; S.team = [];
  ['token', 'user', 'tasks', 'team'].forEach(store.del); location.hash = ''; render();
}

/* ---------- actions (event delegation) ---------- */
document.addEventListener('touchstart', () => {}, { passive: true });
document.addEventListener('click', async e => {
  const el = e.target.closest('button,a,input'); if (!el) return;
  if (navigator.vibrate && el.matches('.btn,.check,.fab,[data-done]')) navigator.vibrate(8);
  const ds = el.dataset;
  if ('lang' in ds) return setLang(S.lang === 'ar' ? 'fr' : 'ar');
  if ('settings' in ds) return settingsSheet();
  if (ds.f) { S.f = ds.f; return render(); }
  if (ds.scope) { S.scope = ds.scope; return render(); }
  if ('new' in ds) { S.draft = null; return go('task'); }
  if ('nfab' in ds) { if (location.hash !== '#prep') go('prep'); setTimeout(() => { const x = document.getElementById('x-in'); if (x) { window.scrollTo({ top: 0, behavior: 'smooth' }); x.focus(); } }, 120); return; }
  if (ds.edit) { S.draft = null; return go('task/' + ds.edit); }
  if (ds.done) return toggleDone(ds.done);
  if (ds.remind) {
    const x = S.tasks.find(y => y.id === ds.remind), u = userById(x.assigneeId);
    return wa(u.phone, fill(t('wa_rem'), { n: u.name, t: x.title, d: fmtDue(x.due) }));
  }
  // task form
  if (ds.who) { keepTitle(); S.draft.assigneeId = ds.who; return rerenderForm(); }
  if (ds.day) { keepTitle(); const d = ds.day === 'today' ? new Date() : addDays(new Date(), 1); S.draft.due = dayKey(d) + S.draft.due.slice(10); return rerenderForm(); }
  if (ds.rep) { keepTitle(); S.draft.repeat = ds.rep; return rerenderForm(); }
  if ('wa' in ds) { S.draft.wa = !S.draft.wa; el.classList.toggle('on'); el.setAttribute('aria-checked', S.draft.wa); return; }
  if (ds.del) {
    if (!(await ask(t('del_q'), t('del')))) return;
    const before = S.tasks; S.tasks = S.tasks.filter(y => y.id !== ds.del); save(); S.draft = null; go('tasks');
    try { await api('tasks.delete', { id: ds.del }); } catch (er) { S.tasks = before; save(); render(); fail(er); }
    return;
  }
  if (ds.prole) { document.querySelectorAll('[data-prole]').forEach(b => b.classList.toggle('on', b === el)); return; }
  // team
  if (ds.reset) {
    if (!(await ask(t('reset_q'), t('reset')))) return;
    try { const r = await api('team.resetCode', { id: ds.reset }); codeSheet(userById(ds.reset), r.code); } catch (er) { fail(er); }
    return;
  }
  if (ds.role) {
    const u = userById(ds.role), role = u.role === 'manager' ? 'employee' : 'manager', old = u.role;
    u.role = role; render();
    try { await api('team.update', { id: u.id, role }); save(); } catch (er) { u.role = old; render(); fail(er); }
    return;
  }
  if (ds.active) {
    const u = userById(ds.active);
    if (u.active && !(await ask(t('dis_q'), t('disable')))) return;
    u.active = !u.active; render();
    try { await api('team.update', { id: u.id, active: u.active }); save(); } catch (er) { u.active = !u.active; render(); fail(er); }
  }
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-dayp]') && e.target.value) { keepTitle(); S.draft.due = e.target.value + S.draft.due.slice(10); rerenderForm(); }
  if (e.target.matches('#tf [name=time]') && S.draft) S.draft.due = S.draft.due.slice(0, 10) + 'T' + e.target.value;
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'tf') { e.preventDefault(); return saveTask(); }
  if (e.target.id === 'pf') { e.preventDefault(); return addPerson(e.target); }
});
function keepTitle() { const f = $('#tf'); if (f && S.draft) { S.draft.title = f.title.value; S.draft.due = S.draft.due.slice(0, 10) + 'T' + (f.time.value || '18:00'); } }
function rerenderForm() { const y = window.scrollY; render(); window.scrollTo(0, y); }

async function toggleDone(id) {
  const x = S.tasks.find(y => y.id === id), old = x.status, oldDone = x.doneAt;
  const to = status(x) === 'done' ? 'new' : 'done';
  x.status = to; x.doneAt = to === 'done' ? new Date().toISOString() : ''; save(); render();
  if (to === 'done' && navigator.vibrate) navigator.vibrate(12);
  try {
    const r = await api('tasks.setStatus', { id, status: to });
    Object.assign(x, r.task); if (r.next && !S.tasks.some(y => y.id === r.next.id)) S.tasks.push(r.next); save(); render();
  } catch (er) { x.status = old; x.doneAt = oldDone; save(); render(); fail(er); }
}
async function saveTask() {
  keepTitle();
  const d = S.draft;
  if (!d.title.trim()) { $('#te').textContent = t('need_title'); $('#tf').title.focus(); return; }
  const task = { id: d.id, title: d.title.trim(), assigneeId: d.assigneeId, due: d.due, repeat: d.repeat };
  const btn = $('#tf button[type=submit]'); btn.disabled = true;
  try {
    const saved = await api('tasks.save', { task });
    const i = S.tasks.findIndex(y => y.id === saved.id); if (i >= 0) S.tasks[i] = saved; else S.tasks.push(saved);
    save();
    const u = userById(saved.assigneeId);
    if (!d.id && d.wa && u && u.id !== S.user.id) wa(u.phone, fill(t('wa_task'), { n: u.name, t: saved.title, d: fmtDue(saved.due) }));
    S.draft = null; toast(t('saved')); go('tasks');
  } catch (er) { btn.disabled = false; fail(er); }
}
async function addPerson(f) {
  const name = f.name.value.trim(), username = f.username.value.trim().toLowerCase(), phone = f.phone.value.replace(/\D/g, '').replace(/^222/, '');
  const role = document.querySelector('[data-prole].on').dataset.prole;
  if (!name || !username || !phone) { $('#pe').textContent = t('need_fields'); return; }
  if (!/^[234]\d{7}$/.test(phone)) { $('#pe').textContent = t('phone_err'); f.phone.focus(); return; }
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  try {
    const r = await api('team.add', { name, username, phone, role });
    S.team.push(r.user); save(); go('team'); codeSheet(r.user, r.code);
  } catch (er) { btn.disabled = false; $('#pe').textContent = er.message === 'username_taken' ? (S.lang === 'ar' ? 'اسم المستخدم مستعمل' : 'Identifiant déjà pris') : ''; if (er.message !== 'username_taken') fail(er); }
}

/* ---------- start (after prep.js and other modules have loaded) ---------- */
const quiet = () => !document.querySelector('form,.sheet-bg') && location.hash.replace(/^#\/?/, '').split('/')[0] !== 'prep';
function start() {
  render();
  if (S.token) refresh().then(() => { if (quiet()) render(); }).catch(e => { if (e.message !== 'auth') console.warn(e); });
  setInterval(() => { if (S.token && document.visibilityState === 'visible') refresh().then(() => { if (quiet()) render(); }).catch(() => {}); }, 60000);
  document.addEventListener('visibilitychange', () => { if (S.token && document.visibilityState === 'visible') refresh().then(() => { if (quiet()) render(); }).catch(() => {}); });
}
document.addEventListener('DOMContentLoaded', start);
if ('serviceWorker' in navigator && location.protocol === 'https:' && !DEMO) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
<script src="prep.js"></script>
</body>
</html>
